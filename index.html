    <!-- Structured Data: FAQPage — gera rich results no Google (People Also Ask) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Como controlar meu dinheiro com o Openfy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Com o Openfy, você registra suas transações, o app categoriza automaticamente e gera um Score de Saúde Financeira de 0 a 1000 com insights de IA. Em minutos você tem uma visão completa de para onde seu dinheiro vai, quanto pode economizar e o que precisa mudar para alcançar suas metas."
          }
        },
        {
          "@type": "Question",
          "name": "Qual o melhor app de gestão financeira pessoal do Brasil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Openfy é o único app brasileiro com Score de Saúde Financeira de 0 a 1000, que analisa 7 pilares financeiros simultaneamente: reserva de emergência, taxa de poupança, diversificação de renda, nível de endividamento, consistência dos registros, liquidez e cumprimento de metas — dando uma nota real e objetiva da sua saúde financeira."
          }
        },
        {
          "@type": "Question",
          "name": "Como organizar meu dinheiro do zero?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Openfy guia você passo a passo: primeiro visualize todos os seus gastos por categoria, depois defina um orçamento mensal, acompanhe seu progresso no Score de Saúde Financeira e siga as recomendações de IA personalizadas. Em 30 dias você já tem controle real das suas finanças."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso de cartão de crédito para o trial gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O trial de 14 dias é 100% grátis, sem pedir cartão ou dados de pagamento. Você só é cobrado se decidir continuar após o trial."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o Score de Saúde Financeira?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nosso algoritmo analisa 7 pilares: reserva de emergência, taxa de poupança, diversificação de renda, nível de endividamento, consistência dos registros, liquidez e cumprimento de metas. O resultado é um número de 0 a 1000 que resume sua saúde financeira em tempo real, como um score de crédito, mas para suas finanças pessoais."
          }
        },
        {
          "@type": "Question",
          "name": "O Openfy tem app para celular (iOS e Android)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! O Openfy é um Progressive Web App (PWA) — você instala diretamente do navegador do celular, ele fica na tela inicial e funciona como um app nativo, inclusive offline. Apps nativos iOS e Android estão previstos para o segundo semestre de 2026."
          }
        },
        {
          "@type": "Question",
          "name": "A IA tem acesso aos meus dados pessoais?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A IA processa apenas números agregados e categorias — nunca dados pessoais identificáveis. Os relatórios são gerados com base em padrões financeiros anonimizados. Seus dados ficam no Supabase com criptografia em repouso e isolamento total por usuário (Row Level Security), em conformidade com a LGPD."
          }
        },
        {
          "@type": "Question",
          "name": "Posso cancelar o Openfy quando quiser?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, sem multa, sem burocracia e sem período de carência. Ao cancelar, você mantém acesso até o fim do ciclo pago. Seus dados ficam disponíveis para exportação por 30 dias, depois são removidos completamente."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o Plano Família do Openfy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Uma assinatura única de R$ 34,90/mês para até 4 membros da família. Cada pessoa tem seu perfil independente com dados privados — ninguém vê os dados de ninguém. O administrador tem acesso a um painel consolidado com visão geral da família."
          }
        },
        {
          "@type": "Question",
          "name": "O Openfy vende ou compartilha meus dados financeiros?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nunca. Nosso modelo de negócio é exclusivamente por assinatura. Seus dados financeiros não são vendidos, compartilhados ou usados para publicidade. Estamos em conformidade total com a LGPD (Lei Geral de Proteção de Dados)."
          }
        }
      ]
    }
    </script>
