<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16A34A"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff08" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff08" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff08" stroke-width="1"/>

  <!-- Green glow orb -->
  <circle cx="900" cy="315" r="280" fill="#16A34A" opacity="0.06"/>
  <circle cx="900" cy="315" r="180" fill="#16A34A" opacity="0.06"/>

  <!-- Left content -->
  <!-- Logo mark -->
  <rect x="80" y="160" width="52" height="52" rx="12" fill="#16A34A"/>
  <rect x="92" y="172" width="8" height="20" rx="2" fill="white"/>
  <rect x="104" y="164" width="8" height="28" rx="2" fill="white"/>
  <rect x="116" y="168" width="8" height="24" rx="2" fill="white"/>

  <!-- Openfy wordmark -->
  <text x="148" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="white" letter-spacing="-1">Openfy</text>

  <!-- Green divider line -->
  <rect x="80" y="238" width="60" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Main headline -->
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="white" letter-spacing="-2">Controle seu</text>
  <text x="80" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="url(#accent)" letter-spacing="-2">dinheiro</text>
  <text x="80" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="white" letter-spacing="-2">com IA.</text>

  <!-- Subtitle -->
  <text x="80" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9CA3AF" letter-spacing="-0.3">Score de Saúde Financeira de 0 a 1000 · 14 dias grátis</text>

  <!-- Right: Score card mockup -->
  <rect x="740" y="140" width="380" height="350" rx="20" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Card header -->
  <text x="770" y="185" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">Score de Saúde Financeira</text>

  <!-- Score number -->
  <text x="770" y="260" font-family="system-ui, sans-serif" font-size="80" font-weight="800" fill="white" letter-spacing="-3">782</text>

  <!-- Score bar track -->
  <rect x="770" y="278" width="320" height="6" rx="3" fill="#2A2A2A"/>
  <!-- Score bar fill -->
  <rect x="770" y="278" width="250" height="6" rx="3" fill="url(#accent)"/>

  <!-- Score label -->
  <text x="770" y="310" font-family="system-ui, sans-serif" font-size="14" fill="#16A34A" font-weight="600">● Ótimo</text>

  <!-- Mini stats -->
  <rect x="770" y="338" width="140" height="60" rx="10" fill="#111111"/>
  <text x="790" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Economia</text>
  <text x="790" y="386" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#16A34A">+23%</text>

  <rect x="930" y="338" width="160" height="60" rx="10" fill="#111111"/>
  <text x="950" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">vs mês anterior</text>
  <text x="950" y="386" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">↑ R$ 430</text>

  <!-- AI badge -->
  <rect x="770" y="418" width="320" height="52" rx="10" fill="#0D1F14"/>
  <rect x="770" y="418" width="4" height="52" rx="2" fill="#16A34A"/>
  <text x="786" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Análise IA</text>
  <text x="786" y="459" font-family="system-ui, sans-serif" font-size="13" fill="#D1FAE5">Você está economizando mais que 78% dos usuários</text>

  <!-- Bottom URL -->
  <text x="80" y="580" font-family="system-ui, sans-serif" font-size="18" fill="#374151">useopenfy.com.br</text>
</svg>
